<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelAfricana - Art Collections</title>
    <link rel="icon" type="image/x-icon" href="/cinnity_favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght=1,500&family=Manufacturing+Consent&family=Playfair+Display:ital,wght=1,500&family=Quicksand:wght@300..700&family=Syne:wght@500&display=swap"
        rel="stylesheet">
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>

<body>

    <header class="site-header">
        <div class="header-container">
            <div class="brand-block">
                <a href="index.html" class="logo-link">
                    <img src="images/pixelafricana_logo.png" alt="Pixel Africana Logo Symbol" class="logo-img">
                    <div class="brand-text">
                        <span class="brand-name">PixelAfricana</span>
                        <span class="brand-sub">Culture by the Pixel ™</span>
                    </div>
                </a>
            </div>

            <div class="header-utilities" style="display: flex; align-items: center; gap: 1rem;">
                <div class="search-box">
                    <svg class="search-vector-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                    </svg>
                    <input type="text" placeholder="Search products...">
                </div>

                <div class="cart-status-widget" onclick="location.href='cart.html'" style="cursor: pointer;">
                    <span class="cart-total">$0.00</span>
                    <span class="cart-count">0 items</span>
                    <svg class="cart-vector-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.05 1.4-2.55h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" />
                    </svg>
                </div>

                <a href="https://instagram.com/pixelafricana" target="_blank" rel="noopener noreferrer"
                    class="instagram-utility-link" aria-label="Follow PixelAfricana on Instagram"
                    style="display: flex; align-items: center; justify-content: center; padding: 0.5rem; color: #333; transition: all 0.2s ease; margin-left: 0.25rem;">
                    <svg class="instagram-vector-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor"
                        stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <nav class="main-navigation">
        <div class="nav-container">
            <input type="checkbox" id="mobile-menu-toggle" class="menu-toggle-checkbox">
            <label for="mobile-menu-toggle" class="menu-toggle-btn" aria-label="Toggle navigation menu">
                <svg class="hamburger-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor"
                    stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </label>

            <div class="nav-links-wrapper">
                <a href="index.html" class="nav-item">Home</a>
                <a href="about.html" class="nav-item">About Us</a>
                <a href="how-it-works.html" class="nav-item">How It Works</a>
                <a href="poetry.html" class="nav-item">Poetry</a>
            </div>
        </div>
    </nav>

    <main class="shop-view-wrapper">
        <div class="category-header-meta">
            <nav class="breadcrumb-trail">
                <a href="index.html">Home</a> ›
                <span class="current-trail-node" id="catalogBreadcrumbTitle">Collection</span>
            </nav>

            <div class="catalog-right-controls-wrapper" style="display: flex; align-items: center; gap: 1.5rem;">
                <span class="results-counter-string" id="catalogResultsCount">Showing all 1 results</span>

                <div class="catalog-filters-toolbar" style="margin: 0;">
                    <select class="catalog-sort-select" aria-label="Sort products">
                        <option value="default" selected>Default sorting</option>
                        <option value="price-low-high">Price: low to high</option>
                        <option value="price-high-low">Price: high to low</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="product-grid-layout" id="catalogProductInjectionNode">
            <article class="product-card" data-fulfillment="printify">
                <div class="product-image-wrapper">
                    <a href="product-detail-good-medicine.html">
                        <img src="https://images-api.printify.com/mockup/6a3fd420f52c964027076635/91657/60163/sepia-african-couple-laughing-canvas.jpg?camera_label=front" alt="good-medicine" class="product-img">
                    </a>
                </div>
                <div class="product-details">
                    <h2 class="product-title">
                        <a href="product-detail-good-medicine.html" style="text-decoration:none; color:inherit;">Good Medicine</a>
                    </h2>
                    <div class="badge-row">
                        
                    </div>
                    <div class="price-row">
                        
                        <span class="price-current">$42.23</span>
                    </div>
                    <button class="add-to-cart-btn" data-id="good-medicine">Add to cart</button>
                </div>
            </article></div>
    </main>
    <footer class="minimal-footer">
        <div class="footer-container">
            <p>&copy; Pixel Africana 2026</p>
        </div>
    </footer>

    <script src="shopEngine.js" defer></script>
</body>

</html>
