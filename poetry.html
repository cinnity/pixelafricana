<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Africana - How It Works</title>
    <link rel="icon" type="image/svg+xml" href="cinnity_favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?&family=Quicksand:wght@300..700&family=Manufacturing+Consent&display=swap&family=Cormorant+Garamond:ital,wght@1,500&family=Playfair+Display:ital,wght@1,500&family=Syne:wght@500&display=swap"
        rel="stylesheet">
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>

<body>

    <header class="site-header">
        <div class="header-container">
            <div class="brand-block">
                <a href="index.html" class="logo-link">
                    <img src="images/pixelafricana_logo.png" alt="Pixel Africana Logo Symbol" class="logo-img">
                    <div class="brand-text">
                        <span class="brand-name">PixelAfricana</span>
                        <span class="brand-sub">Culture by the Pixel ™</span>
                    </div>
                </a>
            </div>

            <div class="header-utilities">
                <div class="search-box">
                    <svg class="search-vector-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                    </svg>
                    <input type="text" placeholder="Search products...">
                </div>
                <div class="cart-status-widget" onclick="location.href='cart.html'" style="cursor: pointer;">
                    <span class="cart-total"></span>
                    <span class="cart-count"></span>

                    <svg class="cart-vector-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.05 1.4-2.55h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z" />
                    </svg>
                </div>
            </div>
        </div>
    </header>

<nav class="main-navigation">
        <div class="nav-container">
            <!-- Mobile Menu Toggle Trigger -->
            <input type="checkbox" id="mobile-menu-toggle" class="menu-toggle-checkbox">
            <label for="mobile-menu-toggle" class="menu-toggle-btn" aria-label="Toggle navigation menu">
                <svg class="hamburger-icon" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </label>

            <!-- Navigation Links Wrapper Group -->
            <div class="nav-links-wrapper">
                <a href="index.html" class="nav-item">Home</a>
                <a href="about.html" class="nav-item">About</a>
                <a href="how-it-works.html" class="nav-item">How It Works</a>
                <a href="poetry.html" class="nav-item active">Poetry</a>
            </div>
        </div>
    </nav>
    <main class="shop-view-wrapper">

        <div class="poetry-pagination-bar" id="topPagination">
            <button class="nav-chevron-btn" id="prevBtnTop" aria-label="Previous Profile">
                <svg viewBox="0 0 24 24">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
                </svg>
            </button>
            <div class="page-indicators" id="indicatorsTop"></div>
            <button class="nav-chevron-btn" id="nextBtnTop" aria-label="Next Profile">
                <svg viewBox="0 0 24 24">
                    <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
                </svg>
            </button>
        </div>

        <div class="profile-showcase-card">
            <div class="profile-grid-layout" id="profileContent">
            </div>
        </div>

        <div class="poetry-pagination-bar bottom-bar" id="bottomPagination">
            <button class="nav-chevron-btn" id="prevBtnBottom" aria-label="Previous Profile">
                <svg viewBox="0 0 24 24">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
                </svg>
            </button>
            <div class="page-indicators" id="indicatorsBottom"></div>
            <button class="nav-chevron-btn" id="nextBtnBottom" aria-label="Next Profile">
                <svg viewBox="0 0 24 24">
                    <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
                </svg>
            </button>
        </div>

    </main>

    <footer class="minimal-footer">
        <div class="footer-container">
            <p>&copy; Pixel Africana 2026</p>
        </div>
    </footer>

<script>
        // Global variables for internal state tracking
        let dynamicProfiles = [];
        let currentIndex = 0;

        // Async initialization hook to pull the raw products data layer
        async function initializePoetryPlatform() {
            try {
                // Fetch the relative JSON file
                const response = await fetch('productsData.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP network error encountered: Fetch status ${response.status}`);
                }
                
                const fullData = await response.json();
                
                // Filter database dynamically to strip out unpopulated mockup poems ("Foo")
                dynamicProfiles = fullData.products.filter(p => p.poem && p.poem[0] !== "Foo");
                
                if (dynamicProfiles.length > 0) {
                    // Check URL for specific ID query strings
                    const urlParams = new URLSearchParams(window.location.search);
                    const targetId = urlParams.get('id') || urlParams.get('product');
                    
                    let initialIndex = 0; // Default fallback to first element
                    
                    if (targetId) {
                        // Find match based on a lowercase comparison of the title or an explicit id field
                        const matchedIndex = dynamicProfiles.findIndex(p => 
                            (p.id && p.id.toLowerCase() === targetId.toLowerCase()) || 
                            (p.title && p.title.toLowerCase() === targetId.toLowerCase())
                        );
                        
                        if (matchedIndex !== -1) {
                            initialIndex = matchedIndex;
                        } else {
                            console.warn(`Query string ID "${targetId}" did not match any active profiles. Defaulting to index 0.`);
                        }
                    }
                    
                    renderActiveProfile(initialIndex);
                } else {
                    document.getElementById('profileContent').innerHTML = `
                        <div style="padding: 3rem; text-align: center; width: 100%;" class="status-message">
                            No cultural poetry profiles available in the dataset right now.
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error("Critical failure during JSON profile ingestion:", error);
                document.getElementById('profileContent').innerHTML = `
                    <div style="padding: 3rem; text-align: center; width: 100%; color: #a64b2a;" class="status-message">
                        Failure loading the cultural profiles. Please verify productsData.json is present in the server root.
                    </div>
                `;
            }
        }

        function renderActiveProfile(index) {
            if (index < 0 || index >= dynamicProfiles.length) return;
            currentIndex = index;
            
            const profile = dynamicProfiles[currentIndex];
            const contentNode = document.getElementById('profileContent');
            
            // Subtle transition breaks when moving between profiles
            contentNode.style.opacity = '0';
            contentNode.style.transform = 'translateY(4px)';
            
            // Format array stanzas back into string blocks with break rules cleanly
            const verifiedPoemString = profile.poem.join('\n');
            
            setTimeout(() => {
                contentNode.innerHTML = `
                    <div class="profile-visual-pane">
                        <img src="${profile.profileImage}" alt="${profile.altText}" class="sculpture-render-view">
                    </div>
                    <div class="profile-literary-pane">
                        <h2 class="poetic-title-header">“${profile.title}”</h2>
                        <div class="literary-verse-box">${verifiedPoemString}</div>
                        <div class="profile-metadata-footer">
                            <div class="metadata-item">Collection: <span class="metadata-value">${profile.category}</span></div>
                            <div class="metadata-item">Value: <span class="metadata-value">${profile.priceCurrent}</span></div>
                        </div>
                    </div>
                `;
                contentNode.style.opacity = '1';
                contentNode.style.transform = 'translateY(0)';
                refreshPaginationElements();
            }, 180);
        }

        function refreshPaginationElements() {
            // Apply bounds state rules directly to toggle inputs
            document.getElementById('prevBtnTop').disabled = currentIndex === 0;
            document.getElementById('prevBtnBottom').disabled = currentIndex === 0;
            document.getElementById('nextBtnTop').disabled = currentIndex === dynamicProfiles.length - 1;
            document.getElementById('nextBtnBottom').disabled = currentIndex === dynamicProfiles.length - 1;

            buildPaginationIndicators('indicatorsTop');
            buildPaginationIndicators('indicatorsBottom');
        }

        function buildPaginationIndicators(targetContainerId) {
            const container = document.getElementById(targetContainerId);
            container.innerHTML = '';
            
            dynamicProfiles.forEach((_, idx) => {
                const stepIndicator = document.createElement('button');
                stepIndicator.className = `page-dot ${idx === currentIndex ? 'active' : ''}`;
                stepIndicator.textContent = (idx + 1).toString().padStart(2, '0');
                stepIndicator.addEventListener('click', () => renderActiveProfile(idx));
                container.appendChild(stepIndicator);
            });
        }

        // Connect pagination click listeners
        document.getElementById('prevBtnTop').addEventListener('click', () => renderActiveProfile(currentIndex - 1));
        document.getElementById('prevBtnBottom').addEventListener('click', () => renderActiveProfile(currentIndex - 1));
        document.getElementById('nextBtnTop').addEventListener('click', () => renderActiveProfile(currentIndex + 1));
        document.getElementById('nextBtnBottom').addEventListener('click', () => renderActiveProfile(currentIndex + 1));

        // Mount asynchronous engine execution point on page render ready
        document.addEventListener('DOMContentLoaded', initializePoetryPlatform);
    </script>    
</body>

</html>
